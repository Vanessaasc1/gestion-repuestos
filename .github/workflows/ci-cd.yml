name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

      - name: Run backend tests with coverage
        run: npm run test:coverage

  frontend:
    name: Frontend lint, build and E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run EndToEnd tests
        run: npm run test:e2e

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

    steps:
      - name: Deploy backend on Render
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Deploy frontend on Vercel
        if: env.VERCEL_DEPLOY_HOOK_URL != ''
        run: curl -X POST "$VERCEL_DEPLOY_HOOK_URL"

      - name: Deployment instructions
        if: env.RENDER_DEPLOY_HOOK_URL == '' || env.VERCEL_DEPLOY_HOOK_URL == ''
        run: |
          echo "Configure RENDER_DEPLOY_HOOK_URL and VERCEL_DEPLOY_HOOK_URL in GitHub Secrets to enable automatic deploy."
