services:
  - type: web
    name: gestion-repuestos-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-repuestos-db
          property: connectionString

databases:
  - name: gestion-repuestos-db
    plan: free
    databaseName: repuestos_app
    user: repuestos_user
